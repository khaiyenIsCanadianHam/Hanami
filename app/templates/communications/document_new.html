{% extends 'base.html' %}{% block title %}Generate document{% endblock %}{% block content %}<div class="page-header"><div><p class="eyebrow">DOCUMENT LIBRARY</p><h1>Create a project document</h1><p class="muted">Project and client information will be copied into a reviewable draft.</p></div></div><section class="card"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Project<select name="project_id" required><option value="">Choose project</option>{% for project in projects %}<option value="{{ project.id }}" {% if request.args.get('project_id')==project.id|string %}selected{% endif %}>{{ project.reference }} · {{ project.title }}</option>{% endfor %}</select></label><label>Template<select name="template_id" required><option value="">Choose template</option>{% for template in templates %}<option value="{{ template.id }}">{{ template.category }} · {{ template.name }} (v{{ template.version }})</option>{% endfor %}</select></label><label class="full-width">Custom title (optional)<input name="title" maxlength="200"></label><div class="actions full-width"><button class="button">Generate draft</button><a href="/documents">Cancel</a></div></form></section>{% endblock %}
