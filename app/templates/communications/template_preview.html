{% extends 'base.html' %}{% block title %}Template preview{% endblock %}{% block content %}<div class="page-header"><div><h1>{{ template.name }}</h1><p class="muted">Version {{ template.version }} · Preview changes no project records.</p></div><div class="actions"><a class="button secondary" href="/{{ kind }}/templates/{{ template.id }}/export">Export template</a><a class="button secondary" href="/{{ kind }}/templates/{{ template.id }}/edit">Edit template</a></div></div><section class="card"><form method="get" class="inline-form"><label>Bind project data<select name="project_id"><option value="">Show missing placeholders</option>{% for project in projects %}<option value="{{ project.id }}" {% if selected_project and selected_project.id==project.id %}selected{% endif %}>{{ project.title }}</option>{% endfor %}</select></label><button class="button secondary">Update preview</button></form></section><section class="card">{% if subject %}<h2>{{ subject }}</h2>{% endif %}<pre class="document-preview">{{ body }}</pre></section>{% endblock %}
