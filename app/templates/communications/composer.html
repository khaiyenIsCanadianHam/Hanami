{% extends 'base.html' %}{% block title %}Compose email{% endblock %}{% block content %}<div class="page-header"><div><h1>Start a conversation</h1><p class="muted">Choose a template or write a message. You will review the rendered draft before approval.</p></div><a class="button secondary" href="/email">Back to email</a></div><section class="card"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Project<select name="project_id"><option value="">General correspondence</option>{% for project in projects %}<option value="{{ project.id }}" {% if request.args.get('project_id')==project.id|string %}selected{% endif %}>{{ project.reference }} · {{ project.title }}</option>{% endfor %}</select></label><label>Template<select name="template_id"><option value="">Write a custom message</option>{% for template in templates %}<option value="{{ template.id }}">{{ template.category }} · {{ template.name }} (v{{ template.version }})</option>{% endfor %}</select></label><label>Recipient<input type="email" name="recipient" maxlength="254" placeholder="Uses project client when a template is selected"></label><label>Scheduled time (UTC, optional)<input type="datetime-local" name="scheduled_at"></label><label class="full-width">Subject<input name="subject" maxlength="300" placeholder="Generated from template when body is left blank"></label><label class="full-width">Plain-text body<textarea name="body" rows="12" maxlength="100000" placeholder="Leave blank to generate from the selected template."></textarea></label><label class="full-width">Optional HTML body<textarea name="html_body" rows="5" maxlength="100000" placeholder="Formatting tags are sanitized; scripts and unsafe links are removed."></textarea></label><label class="full-width">Attachments (hold Ctrl/⌘ to select)<select name="attachment_ids" multiple size="4">{% for file in files %}<option value="{{ file.id }}">{{ file.original_name }}</option>{% endfor %}</select></label><div class="actions full-width"><button class="button">Save draft for review</button><a href="/documents">Upload an attachment</a></div></form></section>{% endblock %}
