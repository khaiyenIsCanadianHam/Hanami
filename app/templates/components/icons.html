{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'leads' %}<circle cx="10" cy="7" r="4"/><path d="M3 21v-2a7 7 0 0 1 14 0v2M18 7h4m-2-2v4"/>
{% elif name == 'clients' %}<circle cx="9" cy="8" r="3"/><path d="M2 21v-3a7 7 0 0 1 14 0v3M16 4a4 4 0 0 1 0 8M19 15a5 5 0 0 1 3 5"/>
{% elif name == 'projects' %}<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M7 12h10M7 16h6"/>
{% elif name == 'tasks' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 9 2 2 5-5M8 16h8"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18M7 15h2m6 0h2"/>
{% elif name in ['document','inquiries','proposals','contracts','invoices','documents'] %}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8m-8 4h5"/>
{% elif name in ['money','payments','expenses'] %}<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M5 12h.01M19 12h.01"/>
{% elif name == 'email' %}<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/>
{% elif name in ['maintenance','settings'] %}<path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/>
{% elif name == 'analytics' %}<path d="M4 3v17h17M8 15v-4m5 4V7m5 8v-6"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/>
{% elif name == 'bell' %}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% elif name == 'down' %}<path d="m6 9 6 6 6-6"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'logout' %}<path d="M9 3H4v18h5M9 12h12m-4-4 4 4-4 4"/>
{% elif name == 'download' %}<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>
{% elif name == 'flower' %}<path d="M12 12C-1 10 5-4 12 8c7-12 13 2 0 4 13-2 10 13 0 4-10 9-13-6 0-4Z"/><circle cx="12" cy="12" r="2"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/>{% endif %}
</svg>
{%- endmacro %}
