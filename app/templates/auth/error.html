<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · Hanami</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/simple.css') }}">
</head>
<body>
  <main class="guest-content">
    <section class="error-page">
      <p>Hanami</p>
      <h1>{{ code }}</h1>
      <p>{{ message }}</p>
      <a class="button secondary" href="{{ '/dashboard' if current_user.is_authenticated else '/login' }}">{{ 'Back to dashboard' if current_user.is_authenticated else 'Sign in' }}</a>
    </section>
  </main>
</body>
</html>
